name: production

version: '3.8'

services:

  nginx:
    image: pkliui/skinetweb:production-nginx
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    build:
      dockerfile: Dockerfile
      context: ./nginx
    ports:
      - "80:80"
    mem_reservation: "500M"
    mem_limit: "2000M"
    memswap_limit: 2G

  frontend:
    image: pkliui/skinetweb:production-frontend
    restart: unless-stopped
    build:
      dockerfile: Dockerfile
      context: "./skinetweb-ui"
    mem_reservation: "500M"
    mem_limit: "2000M"
    memswap_limit: 2G

  backend:
    image: pkliui/skinetweb:production-backend
    restart: unless-stopped
    build:
      dockerfile: Dockerfile
      context: "./skinetweb-server"
    environment:
      - INFERENCE_URL=http://skinet-service:5001
      - KAGGLE_USERNAME=${KAGGLE_USERNAME}
      - KAGGLE_KEY=${KAGGLE_KEY}
      - ISIC_CACHE_DIR=/isic-cache
      - MAX_CASE_REPORT_CONCURRENCY=${MAX_CASE_REPORT_CONCURRENCY:?required, set in .env} # shared with skinet-service below; both must enforce the same limit
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:?required, set in .env} # shared with skinet-service below; both must enforce the same limit
    volumes:
      - isic-cache:/isic-cache
    depends_on:
      - skinet-service
    mem_reservation: "500M"
    mem_limit: "2000M"
    memswap_limit: 2G

  skinet-service:
    image: pkliui/skinetweb:production-skinet-service
    restart: unless-stopped
    build:
      dockerfile: Dockerfile
      context: "./skinet-service"
    environment:
      - CONFIG_PATH=${CONFIG_PATH:?required, set in .env}
      - MODEL_PATH=${MODEL_PATH:?required, set in .env}
      - INFER_SLOW_WARN_SECONDS=${INFER_SLOW_WARN_SECONDS:?required, set in .env}
      - MAX_CASE_REPORT_CONCURRENCY=${MAX_CASE_REPORT_CONCURRENCY:?required, set in .env} # shared with backend above; both must enforce the same limit
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:?required, set in .env} # shared with backend above; both must enforce the same limit
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-medium-2604}
      - MISTRAL_BASE_URL=${MISTRAL_BASE_URL:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-}
    volumes:
      - ./models:/models:ro
    mem_reservation: "500M"
    mem_limit: "2000M"
    memswap_limit: 2G

volumes:
  isic-cache:
