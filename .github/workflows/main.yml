name: Continuously deploy on EC2 by scaling frontend and backend containers

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code from the github repo
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_TOKEN}}

      - name: Build and push updated Docker images for frontend, backend, nginx and skinet-service
        run: |

          cd ~/actions-runner-skinet/_work/SkiNetWeb/SkiNetWeb/skinetweb-ui
          docker build --no-cache -t pkliui/skinetweb:production-frontend .
          docker push pkliui/skinetweb:production-frontend
          cd ..

          cd ~/actions-runner-skinet/_work/SkiNetWeb/SkiNetWeb/skinetweb-server
          docker build --no-cache -t pkliui/skinetweb:production-backend .
          docker push pkliui/skinetweb:production-backend
          cd ..

          cd ~/actions-runner-skinet/_work/SkiNetWeb/SkiNetWeb/nginx
          docker build --no-cache -t pkliui/skinetweb:production-nginx .
          docker push pkliui/skinetweb:production-nginx
          cd ..

          cd ~/actions-runner-skinet/_work/SkiNetWeb/SkiNetWeb/skinet-service
          docker build --no-cache -t pkliui/skinetweb:production-skinet-service .
          docker push pkliui/skinetweb:production-skinet-service
          cd ..

      - name: Pull freshly pushed images for compose
        run: |
          cd ~/actions-runner-skinet/_work/SkiNetWeb/SkiNetWeb
          docker compose pull frontend backend nginx skinet-service

      - name: Containers before scaling up
        run: docker ps -a

      - name: Scale up frontend, nginx keeps routing to the old one
        run: |
          cd ~/actions-runner-skinet/_work/SkiNetWeb/SkiNetWeb
          docker compose -f docker-compose.yml up -d --no-build --force-recreate --scale frontend=2 --wait

      - name: Reload nginx without restarting its container
        run: docker exec $(sudo docker ps -q | xargs sudo docker inspect --format='{{.Name}}' | grep production-nginx) nginx -s reload

      - name: Containers after scaling up frontend
        run: docker ps -a

      - name: Update the frontend
        run: |
          old_frontend_id=$(docker ps -f name=production-frontend --format '{{.ID}} {{.CreatedAt}}' | sort -k2,3 | head -n 1 | awk '{print $1}')
          docker stop $old_frontend_id
          docker rm $old_frontend_id
          cd ~/actions-runner-skinet/_work/SkiNetWeb/SkiNetWeb
          docker compose -f docker-compose.yml up -d --no-build --force-recreate --scale frontend=1 --wait frontend
          docker exec $(sudo docker ps -q | xargs sudo docker inspect --format='{{.Name}}' | grep production-nginx) nginx -s reload

      - name: Scale up backend, nginx keeps routing to the old one
        run: |
          cd ~/actions-runner-skinet/_work/SkiNetWeb/SkiNetWeb
          docker compose -f docker-compose.yml up -d --no-build --force-recreate --scale backend=2 --wait

      - name: Reload nginx without restarting its container
        run: docker exec $(sudo docker ps -q | xargs sudo docker inspect --format='{{.Name}}' | grep production-nginx) nginx -s reload

      - name: Containers after scaling up backend
        run: docker ps -a

      - name: Update the backend
        run: |
          old_backend_id=$(docker ps -f name=production-backend --format '{{.ID}} {{.CreatedAt}}' | sort -k2,3 | head -n 1 | awk '{print $1}')
          docker stop $old_backend_id
          docker rm $old_backend_id
          cd ~/actions-runner-skinet/_work/SkiNetWeb/SkiNetWeb
          docker compose -f docker-compose.yml up -d --no-build --force-recreate --scale backend=1 --wait backend
          docker exec $(sudo docker ps -q | xargs sudo docker inspect --format='{{.Name}}' | grep production-nginx) nginx -s reload

      - name: Containers after updating frontend and backend
        run: docker ps -a
