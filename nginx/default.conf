upstream frontend {
    server frontend:3000; # frontend service in docker compose
}

upstream backend {
    server backend:5000; # backend service in docker compose
}

server {
    listen 80; # nginx listens on port 80

    # MAX_UPLOAD_BYTES (10 MiB, .env.config) + 1M headroom for the multipart
    # framing (measured at ~0.2-0.4 KB). Must stay above the app limit so
    # Express/Python enforce the real rule; this file is static (no envsubst),
    # so keep it in sync by hand.
    client_max_body_size 11M;

    # nginx rejects bodies over the cap itself, before Express sees them, so
    # Express's 413 message can't be passed through. Answer with the same JSON
    # shape instead. "10 MB" is MAX_UPLOAD_BYTES; keep it in sync by hand, like
    # client_max_body_size above.
    error_page 413 = @upload_too_large;

    location @upload_too_large {
        default_type application/json;
        return 413 '{"error": "Image is too large. Maximum size is 10 MB."}';
    }

    location / {
        proxy_pass http://frontend;
    }

    location /api {
        proxy_pass http://backend;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 70s;
        proxy_read_timeout 70s;
    }
}
