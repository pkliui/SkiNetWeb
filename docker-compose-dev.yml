version: '3.8'

services:

  nginx:
    depends_on:
      - frontend
      - backend
    restart: always
    build:
      dockerfile: Dockerfile.dev
      context: ./nginx
    ports:
      - "8002:80"


  frontend:
    build:
      dockerfile: Dockerfile.dev
      context: "./skinetweb-ui"
    volumes:
      - /app/node_modules
      - ./skinetweb-ui:/app
    ports:
      - "3000:3000"


  backend:
    build:
      dockerfile: Dockerfile.dev
      context: "./skinetweb-server"
    volumes:
      - /app/node_modules
      - ./skinetweb-server:/app
    ports:
      - "5000:5000"
    environment:
      - INFERENCE_URL=http://skinet-service:5001
    depends_on:
      - skinet-service

  skinet-service:
    build:
      dockerfile: Dockerfile.dev
      context: "./skinet-service"
    ports:
      - "5001:5001"
    environment:
      - MODEL_PATH=/models/ios_onnx.onnx
      - SEGMENTATION_THRESHOLD=0.5
    volumes:
      - ./models:/models:ro
