name: staging

version: '3.8'

services:

  nginx:
    image: pkliui/skinetweb:staging-nginx
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    build:
      dockerfile: Dockerfile
      context: ./nginx
    ports:
      - "8001:80"
    mem_reservation: "500M"
    mem_limit: "2000M"
    memswap_limit: 2G

  frontend:
    image: pkliui/skinetweb:staging-frontend
    restart: unless-stopped
    build:
      dockerfile: Dockerfile
      context: "./skinetweb-ui"
    ports:
      - "3000"
    mem_reservation: "500M"
    mem_limit: "2000M"
    memswap_limit: 2G

  backend:
    image: pkliui/skinetweb:staging-backend
    restart: unless-stopped
    build:
      dockerfile: Dockerfile
      context: "./skinetweb-server"
    ports:
      - "5000"
    environment:
      - INFERENCE_URL=http://skinet-service:5001
      - ISIC_IMAGES_PATH=/isic-images
      - ISIC_MASKS_PATH=/isic-masks
    volumes:
      - /teamspace/lightning_storage/isic2017/ISIC2017DATA_256/ISIC-2017_Test_v2_Data/ISIC-2017_Test_v2_Data:/isic-images:ro
      - /teamspace/lightning_storage/isic2017/ISIC2017DATA_256/ISIC-2017_Test_v2_Part1_GroundTruth/ISIC-2017_Test_v2_Part1_GroundTruth:/isic-masks:ro
    depends_on:
      - skinet-service
    mem_reservation: "500M"
    mem_limit: "2000M"
    memswap_limit: 2G

  skinet-service:
    image: pkliui/skinetweb:staging-skinet-service
    restart: unless-stopped
    build:
      dockerfile: Dockerfile
      context: "./skinet-service"
    ports:
      - "5001"
    environment:
      - MODEL_PATH=/models/ios_onnx.onnx
      - SEGMENTATION_THRESHOLD=0.5
    volumes:
      - ./models:/models:ro
    mem_reservation: "500M"
    mem_limit: "2000M"
    memswap_limit: 2G
