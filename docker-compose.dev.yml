name: dev

version: '3.8'

services:

  nginx:
    image: pkliui/skinetweb:dev-nginx
    depends_on:
      - frontend
      - backend
    restart: always
    build:
      dockerfile: Dockerfile
      context: ./nginx
    ports:
      - "8002:80"
    mem_reservation: "500M"
    mem_limit: "2000M"
    memswap_limit: 2G

  frontend:
    image: pkliui/skinetweb:dev-frontend
    build:
      dockerfile: Dockerfile
      context: "./skinetweb-ui"
    ports:
      - "3000"
    mem_reservation: "500M"
    mem_limit: "2000M"
    memswap_limit: 2G

  backend:
    image: pkliui/skinetweb:dev-backend
    build:
      dockerfile: Dockerfile
      context: "./skinetweb-server"
    ports:
      - "5000"
    environment:
      - INFERENCE_URL=http://skinet-service:5001
      - KAGGLE_USERNAME=${KAGGLE_USERNAME}
      - KAGGLE_KEY=${KAGGLE_KEY}
      - ISIC_CACHE_DIR=/isic-cache
      - MAX_SEGMENT_CONCURRENCY=1        # t3.small: no memory headroom for concurrent inference
      - MAX_CASE_REPORT_CONCURRENCY=5
      - SEGMENT_TIMEOUT_MS=5000         # real ISIC image, 5 runs, max 1.65s
      - CASE_REPORT_TIMEOUT_MS=30000     # TODO: likely too tight for LLM calls, pending real test
      - MAX_UPLOAD_BYTES=10485760
    volumes:
      - isic-cache:/isic-cache
    depends_on:
      - skinet-service
    mem_reservation: "500M"
    mem_limit: "2000M"
    memswap_limit: 2G

  skinet-service:
    image: pkliui/skinetweb:dev-skinet-service
    build:
      dockerfile: Dockerfile
      context: "./skinet-service"
    ports:
      - "5001"
    environment:
      - MODEL_PATH=/models/ios_onnx.onnx
      - SEGMENTATION_THRESHOLD=0.5
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-02-15-preview}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-20}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - LLM_MAX_OUTPUT_TOKENS=${LLM_MAX_OUTPUT_TOKENS:-700}
    volumes:
      - ./models:/models:ro
    mem_reservation: "500M"
    mem_limit: "2000M"
    memswap_limit: 2G

volumes:
  isic-cache:

